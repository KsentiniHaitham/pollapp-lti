const parseHash = () => {

};

/* â”€â”€ LIVE HOOKS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
/* Normalise l'event Firebase : garantit que questions/answers existent toujours */
const normalizeEv = (val) => {
  if (!val) return null;
  return {
    ...val,
    questions: Array.isArray(val.questions) ? val.questions : [],
    answers:   val.answers && typeof val.answers === 'object' ? val.answers : {},
  };
};

function useLive(code) {
  const [ev, setEv] = useState(null);
  useEffect(() => {
    if (!code || !fireDb) return;
    const ref = evRef(code);
    const cb  = snap => setEv(normalizeEv(snap.val()));
    ref.on('value', cb);
    return () => ref.off('value', cb);
  }, [code]);
  return ev;
}

function useLiveCourseEvent(courseId) {
  const [code, setCode] = useState(undefined); // undefined = chargement
  useEffect(() => {
    if (!courseId || !fireDb) { setCode(null); return; }
    const ref = courseRef(courseId).child('currentEventCode');
    const cb  = snap => setCode(snap.val() || null);
    ref.on('value', cb);
    return () => ref.off('value', cb);
  }, [courseId]);
  return code;
}

/* Gère l'identité de l'utilisateur dans les 3 cas :
   - Juste après un launch LTI (params URL)
   - Navigation interne LTI (sessionStorage)
   - Connexion web enseignant (localStorage JWT)              */
function useLTIUser() {
  const [user,    setUser]    = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    // 1. Params URL â†’ launch LTI entrant
    const params = new URLSearchParams(location.search);
    if (params.get('lti') === '1') {
      const u = {
        id:         params.get('id')         || genId(),
        name:       params.get('name')       || 'Anonyme',
        email:      params.get('email')      || '',
        role:       params.get('role')       || 'learner',
        courseId:   params.get('courseId')   || null,
        courseName: params.get('courseName') || 'Cours',
        source:     'lti',
      };
      sessionStorage.setItem('pollapp_lti', JSON.stringify(u));
      setUser(u);
      history.replaceState({}, '', '/');
      setLoading(false);
      return;
    }

    // 2. sessionStorage â†’ navigation interne après un launch LTI
    const stored = sessionStorage.getItem('pollapp_lti');
    if (stored) {
      try { setUser({ ...JSON.parse(stored), source: 'lti' }); } catch (_) {}
      setLoading(false);
      return;
    }

    // 3. localStorage JWT â†’ connexion web enseignant
    const token = localStorage.getItem('pollapp_web_token');
    if (token) {
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(u => setUser({ ...u, source: 'web', courseId: 'web_' + u.id, courseName: 'Mes événements' }))
        .catch(() => localStorage.removeItem('pollapp_web_token'))
        .finally(() => setLoading(false));
      return;
    }

    setLoading(false);
  }, []);

  return { user, loading };
}

function QRDisplay({ url, size = 160 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.QRCode) return;
    ref.current.innerHTML = '';
    new window.QRCode(ref.current, {
      text: url, width: size, height: size,
      colorDark: '#4f46e5', colorLight: '#ffffff',
      correctLevel: window.QRCode.CorrectLevel.H,
    });
  }, [url, size]);
  return <div ref={ref} style={{lineHeight:0}}/>;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   RESULTS
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
const COLORS = ['bg-indigo-500','bg-violet-500','bg-sky-500','bg-emerald-500','bg-rose-500','bg-amber-500'];

function MCQResults({ q, answers }) {
  const total = answers.length;
  const votes = q.options.map((opt,i) => ({
    opt, n: answers.filter(a => Array.isArray(a.v) ? a.v.includes(String(i)) : String(a.v)===String(i)).length,
  }));
  return (
    <div className="space-y-3">
      <p className="text-sm text-gray-400">{total} réponse{total!==1?'s':''}</p>
      {votes.map((v,i) => {
        const pct = total > 0 ? Math.round(v.n/total*100) : 0;
        return (
          <div key={i}>
            <div className="flex justify-between text-sm mb-1">
              <span className="font-medium text-gray-700">{String.fromCharCode(65+i)}. {v.opt||'Option'}</span>
              <span className="text-gray-400">{pct}% ({v.n})</span>
            </div>
            <div className="w-full h-8 bg-gray-100 rounded-lg overflow-hidden">
              <div className={"h-full rounded-lg bar " + COLORS[i%COLORS.length]} style={{width:pct+'%'}}/>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function WordCloudResults({ answers }) {
  const words = useMemo(() => {
    const m = {};
    answers.forEach(a => String(a.v).toLowerCase().trim().split(/\s+/).forEach(w => { if(w.length>1) m[w]=(m[w]||0)+1; }));
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,50);
  }, [answers]);
  const max = Math.max(...words.map(([,c])=>c),1);
  const WC  = ['text-indigo-600','text-violet-600','text-sky-500','text-emerald-500','text-rose-500','text-amber-500','text-pink-500','text-teal-500'];
  if (!words.length) return <p className="text-gray-400 text-sm italic">En attenteâ€¦</p>;
  return (
    <div className="flex flex-wrap gap-x-3 gap-y-1 items-baseline py-2 min-h-20">
      {words.map(([w,c],i) => (
        <span key={w} className={"word font-bold " + WC[i%WC.length]}
          style={{fontSize:(.65+(c/max)*2)+'rem', opacity:.55+(c/max)*.45}}>{w}</span>
      ))}
    </div>
  );
}

function OpenResults({ answers }) {
  if (!answers.length) return <p className="text-gray-400 text-sm italic">En attenteâ€¦</p>;
  return (
    <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
      {[...answers].reverse().map((a,i) => (
        <div key={i} className="bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 text-gray-700 text-sm">{String(a.v)}</div>
      ))}
    </div>
  );
}

function RatingResults({ q, answers }) {
  const vals = answers.map(a => Number(a.v));
  const avg  = vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : 0;
  const dist = Array.from({length:q.maxStars},(_,i)=>({n:i+1,c:vals.filter(v=>v===i+1).length}));
  const maxD = Math.max(...dist.map(d=>d.c),1);
  return (
    <div>
      <div className="flex items-baseline gap-4 mb-5">
        <span className="text-5xl font-black text-amber-500">{avg.toFixed(1)}</span>
        <div>
          <div className="flex gap-0.5 mb-0.5">{Array.from({length:q.maxStars},(_,i)=><Ico.Star key={i} on={i<Math.round(avg)} s={18}/>)}</div>
          <p className="text-xs text-gray-400">{answers.length} réponse{answers.length!==1?'s':''} Â· sur {q.maxStars}</p>
        </div>
      </div>
      <div className="space-y-1.5">
        {dist.map(({n,c}) => (
          <div key={n} className="flex items-center gap-2">
            <span className="text-xs text-gray-500 w-4 text-right">{n}</span><Ico.Star on s={11}/>
            <div className="flex-1 h-3.5 bg-gray-100 rounded-full overflow-hidden">
              <div className="h-full bg-amber-400 rounded-full bar" style={{width:(c/maxD*100)+'%'}}/>
            </div>
            <span className="text-xs text-gray-400 w-5 text-right">{c}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function LiveResults({ q, answers }) {
  if (!q) return null;
  const p = {q, answers};
  return (
    <div className="anim-up">
      {q.type==='mcq'       && <MCQResults {...p}/>}
      {q.type==='wordcloud' && <WordCloudResults {...p}/>}
      {q.type==='open'      && <OpenResults {...p}/>}
      {q.type==='rating'    && <RatingResults {...p}/>}
    </div>
  );
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   PRESENTER PAGE
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function PresenterPage({ code, ltiUser, onNewSession }) {
  const ev                   = useLive(code);
  const [selId,  setSelId]   = useState(null);
  const [editor, setEditor]  = useState(null);
  const [copied, setCopied]  = useState(false);
  const [showQR, setShowQR]  = useState(false);

  const totalParticipants = useMemo(() => {
    if (!ev) return 0;
    const ids = new Set();
    Object.values(ev.answers||{}).forEach(arr => {
      (Array.isArray(arr) ? arr : Object.values(arr)).forEach(a => ids.add(a.pid));
    });
    return ids.size;
  }, [ev]);

  if (!ev) return (
    <div className="h-full flex items-center justify-center p-8">
      <p className="text-gray-400">Chargement de l'événementâ€¦</p>
    </div>
  );

  const mutate = (fn) => dbPatch(code, fn);

  const saveQ = (q) => {
    mutate(e => {
      const qs     = Array.isArray(e.questions) ? e.questions : [];
      const exists = qs.some(x => x.id === q.id);
      const questions = exists ? qs.map(x => x.id===q.id?q:x) : [...qs, q];
      return {...e, questions};
    });
    setSelId(q.id); setEditor(null);
  };

  const deleteQ = (qId) => {
    mutate(e => ({
      ...e,
      questions:  (Array.isArray(e.questions) ? e.questions : []).filter(q => q.id!==qId),
      activeQId:  e.activeQId===qId ? null  : e.activeQId,
      launched:   e.activeQId===qId ? false : e.launched,
    }));
    if (selId===qId) setSelId(null);
    if (editor?.q.id===qId) setEditor(null);
  };

  const launch = (qId) => mutate(e => ({...e, activeQId:qId, launched:true}));
  const stop   = ()    => mutate(e => ({...e, launched:false}));

  const copyCode = () => {
    navigator.clipboard?.writeText(ev.code).catch(()=>{});
    setCopied(true); setTimeout(()=>setCopied(false),2000);
  };

  const selQ       = (ev.questions || []).find(q => q.id===selId) || null;
  /* answers/{qId} est un objet {pid: {...}} depuis le fix mobile */
  const selAnswers = selQ ? Object.values((ev.answers||{})[selId] || {}) : [];
  const isLive  = ev.launched && ev.activeQId===selId;
  const joinUrl = baseUrl() + '#/join/' + ev.code;

        </main>

  );
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   PARTICIPANT ANSWER FORMS
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function MCQAnswer({ q, onSubmit }) {
  const [sel, setSel] = useState([]);
  const toggle = (i) => { const s=String(i); setSel(p=>q.multi?(p.includes(s)?p.filter(v=>v!==s):[...p,s]):[s]); };
  const ok = sel.length > 0;
  return (
    <div className="space-y-3">
      {q.options.map((opt,i) => {
        const active = sel.includes(String(i));
        return (
          <button key={i} onClick={()=>toggle(i)}
            className={"w-full flex items-center gap-3 p-4 rounded-2xl border-2 text-left transition-all "+(active?'border-indigo-500 bg-indigo-50':'border-gray-200 hover:border-gray-300 bg-white')}>
            <div className={"w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0 "+(active?'bg-indigo-600 text-white':'bg-gray-100 text-gray-500')}>
              {q.multi?(active?'âœ“':''):String.fromCharCode(65+i)}
            </div>
            <span className={"font-semibold "+(active?'text-indigo-900':'text-gray-700')}>{opt}</span>
          </button>
        );
      })}
      <button onClick={()=>ok&&onSubmit(q.multi?sel:sel[0])} disabled={!ok}
        className={"w-full mt-2 py-4 rounded-2xl font-bold text-lg transition-all "+(ok?'bg-indigo-600 hover:bg-indigo-700 text-white':'bg-gray-100 text-gray-400 cursor-not-allowed')}>
        Valider
      </button>
    </div>
  );
}

function WordCloudAnswer({ onSubmit }) {
  const [val, setVal] = useState('');
  const ok = val.trim().length > 0;
  return (
    <div>
      <input value={val} onChange={e=>setVal(e.target.value)} placeholder="Un mot ou une expressionâ€¦"
        maxLength={30} className="w-full px-5 py-4 text-xl text-center rounded-2xl border-2 border-gray-200 focus:border-sky-400 text-gray-900 font-semibold mb-4"
        onKeyDown={e=>e.key==='Enter'&&ok&&onSubmit(val.trim())} autoFocus/>
      <button onClick={()=>ok&&onSubmit(val.trim())} disabled={!ok}
        className={"w-full py-4 rounded-2xl font-bold text-lg transition-all "+(ok?'bg-sky-500 hover:bg-sky-600 text-white':'bg-gray-100 text-gray-400 cursor-not-allowed')}>
        Envoyer
      </button>
    </div>
  );
}

function OpenAnswer({ onSubmit }) {
  const [val, setVal] = useState('');
  const ok = val.trim().length > 0;
  return (
    <div>
      <textarea value={val} onChange={e=>setVal(e.target.value)} placeholder="Tapez votre réponseâ€¦"
        rows={4} maxLength={500} className="w-full px-4 py-3 rounded-2xl border-2 border-gray-200 focus:border-emerald-400 text-gray-800 resize-none text-base mb-1" autoFocus/>
      <p className="text-xs text-gray-400 text-right mb-3">{val.length}/500</p>
      <button onClick={()=>ok&&onSubmit(val.trim())} disabled={!ok}
        className={"w-full py-4 rounded-2xl font-bold text-lg transition-all "+(ok?'bg-emerald-500 hover:bg-emerald-600 text-white':'bg-gray-100 text-gray-400 cursor-not-allowed')}>
        Envoyer
      </button>
    </div>
  );
}

function RatingAnswer({ q, onSubmit }) {
  const [rating, setRating] = useState(0);
  const [hover,  setHover]  = useState(0);
  return (
    <div className="text-center">
      <div className="flex justify-center gap-2 mb-6 flex-wrap">
        {Array.from({length:q.maxStars},(_,i) => (
          <button key={i} className="star" onClick={()=>setRating(i+1)} onMouseEnter={()=>setHover(i+1)} onMouseLeave={()=>setHover(0)}>
            <Ico.Star on={i<(hover||rating)} s={q.maxStars>6?36:48}/>
          </button>
        ))}
      </div>
      {rating>0 && <p className="text-gray-500 text-sm mb-4">Note : {rating} / {q.maxStars}</p>}
      <button onClick={()=>rating>0&&onSubmit(rating)} disabled={rating===0}
        className={"w-full py-4 rounded-2xl font-bold text-lg transition-all "+(rating>0?'bg-amber-500 hover:bg-amber-600 text-white':'bg-gray-100 text-gray-400 cursor-not-allowed')}>
        Valider
      </button>
    </div>
  );
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   PARTICIPANT PAGE
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function ParticipantPage({ initCode, ltiUser, hideBranding }) {
  const [code,     setCode]     = useState(initCode ? initCode.toUpperCase() : '');
  const [input,    setInput]    = useState(initCode ? initCode.toUpperCase() : '');
  const [joined,   setJoined]   = useState(false);
  const [err,      setErr]      = useState('');
  const [notFound, setNotFound] = useState(false);

  const [pid] = useState(() => {
    if (ltiUser?.id) return ltiUser.id;
    let id = localStorage.getItem('pollapp_pid');
    if (!id) { id = genId(); localStorage.setItem('pollapp_pid', id); }
    return id;
  });

  const ev = useLive(joined ? code : null);

  useEffect(() => {
    if (initCode) { setCode(initCode.toUpperCase()); setJoined(true); }
  }, [initCode]);

  useEffect(() => {
    if (!joined || ev) { setNotFound(false); return; }
    const t = setTimeout(() => setNotFound(true), 4000);
    return () => clearTimeout(t);
  }, [joined, ev]);

  const doJoin = () => {
    const c = input.trim().toUpperCase();
    if (c.length < 4) { setErr('Entrez un code valide.'); return; }
    setErr(''); setNotFound(false); setCode(c); setJoined(true);
  };

  const submit = (value) => {
    if (!ev || !ev.activeQId || !ev.launched) return;
    /* Écriture directe sur le chemin de l'élève :
       plus fiable sur mobile que les transactions (pas de null initial,
       fonctionne hors connexion, pas de race condition) */
    fireDb
      .ref('events/' + code.toUpperCase() + '/answers/' + ev.activeQId + '/' + pid)
      .set({ pid, name: ltiUser?.name || null, v: value, ts: Date.now() })
      .then(() => console.log('[submit] réponse envoyée ✓'))
      .catch(err => console.error('[submit] erreur Firebase:', err.message));
  };

  /* JOIN FORM */
  if (!joined) return (
    <div className="min-h-screen flex items-center justify-center p-4"
      style={{background:'linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#2563eb 100%)'}}>
      <div className="bg-white rounded-2xl p-8 w-full max-w-sm shadow-2xl anim-in">
        <div className="text-center mb-6">
          <div className="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl">ðŸ™‹</div>
          <h1 className="text-2xl font-bold text-gray-900">Rejoindre</h1>
          <p className="text-gray-500 text-sm mt-1">Entrez le code affiché par le présentateur</p>
        </div>
        <input value={input} onChange={e=>{setInput(e.target.value.toUpperCase());setErr('');}}
          placeholder="ABC123" maxLength={6} autoFocus
          className="w-full px-4 py-4 rounded-2xl border-2 border-gray-200 focus:border-indigo-400 text-center font-black text-3xl tracking-widest text-gray-900 mb-2"
          onKeyDown={e=>e.key==='Enter'&&doJoin()}/>
        {err && <p className="text-red-500 text-sm text-center mb-2">{err}</p>}
        <button onClick={doJoin} className="w-full py-3.5 mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl text-lg transition-colors">
          Rejoindre â†’
        </button>
        {!hideBranding && (
          <button onClick={()=>go('/')} className="w-full mt-3 text-gray-400 hover:text-gray-600 text-sm transition-colors">â† Retour</button>
        )}
      </div>
    </div>
  );

  if (!ev) return (
    <div className="min-h-screen flex items-center justify-center p-4"
      style={{background:'linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#2563eb 100%)'}}>
      <div className="bg-white rounded-2xl p-8 w-full max-w-sm shadow-2xl text-center anim-in">
        {notFound ? (
          <>
            <div className="text-5xl mb-4">âŒ</div>
            <h2 className="text-xl font-bold text-gray-900 mb-2">Code introuvable</h2>
            <p className="text-gray-500 text-sm mb-6">Le code <span className="font-bold text-indigo-600">{code}</span> n'existe pas.</p>
            <button onClick={()=>{setJoined(false);setNotFound(false);setInput(code);}}
              className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-colors">Réessayer</button>
          </>
        ) : (
          <>
            <div className="text-5xl mb-4 live-dot" style={{display:'inline-block'}}>â³</div>
            <h2 className="text-xl font-bold text-gray-900 mb-2">Connexionâ€¦</h2>
            <p className="text-gray-400 text-sm">{code}</p>
          </>
        )}
      </div>
    </div>
  );

  const curQ     = ev.activeQId ? (ev.questions || []).find(q => q.id===ev.activeQId) : null;
  const isActive = ev.launched && !!curQ;
  /* Les réponses sont désormais stockées sous answers/{qId}/{pid} (objet) */
  const qAnswers = ev.activeQId ? ((ev.answers||{})[ev.activeQId] || {}) : {};
  const answered = !!(ev.activeQId && qAnswers[pid]);
  const cfg      = curQ ? T[curQ.type] : null;

  return (
    <div className="min-h-screen bg-slate-50 flex flex-col">
      {!hideBranding && (
        <header className="bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3">
          <button onClick={()=>{setJoined(false);go('/');}} className="text-gray-400 hover:text-gray-700 p-1"><Ico.Back/></button>
          <div className="flex-1 min-w-0">
            <h1 className="font-bold text-gray-900 text-base truncate">{ev.title}</h1>
            <p className="text-xs text-gray-400">Code : {ev.code}</p>
          </div>
        </header>
      )}
      {ltiUser && (
        <div className="bg-indigo-50 px-4 py-2 text-sm text-indigo-700 font-medium border-b border-indigo-100">
          ðŸ‘‹ Connecté en tant que <strong>{ltiUser.name}</strong>
        </div>
      )}

      <main className="flex-1 flex items-start justify-center p-4 pt-8">
        <div className="w-full max-w-md">
          {!isActive && (
            <div className="text-center py-16 anim-up">
              <div className="w-24 h-24 rounded-3xl bg-indigo-100 flex items-center justify-center mx-auto mb-6 text-5xl float">â³</div>
              <h2 className="text-2xl font-bold text-gray-800 mb-2">En attenteâ€¦</h2>
              <p className="text-gray-500">Le présentateur n'a pas encore lancé de question.</p>
            </div>
          )}
          {isActive && (
            <div className="space-y-4 anim-in">
              <div className={"rounded-2xl p-6 text-white bg-gradient-to-br shadow-lg "+cfg.grad}>
                <span className="text-xs font-bold uppercase tracking-wider opacity-80">{cfg.icon} {cfg.label}</span>
                <h2 className="text-xl font-extrabold mt-1 leading-snug">{curQ.text}</h2>
              </div>
              {answered ? (
                <div className="bg-white rounded-2xl border-2 border-green-200 p-8 text-center anim-in">
                  <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3"><Ico.Check s={30}/></div>
                  <h3 className="text-xl font-bold text-green-700 mb-1">Réponse envoyée !</h3>
                  <p className="text-gray-400 text-sm">En attente des résultatsâ€¦</p>
                </div>
              ) : (
                <div className="bg-white rounded-2xl p-5 border border-gray-100">
                  {curQ.type==='mcq'       && <MCQAnswer q={curQ} onSubmit={submit}/>}
                  {curQ.type==='wordcloud' && <WordCloudAnswer onSubmit={submit}/>}
                  {curQ.type==='open'      && <OpenAnswer onSubmit={submit}/>}
                  {curQ.type==='rating'    && <RatingAnswer q={curQ} onSubmit={submit}/>}
                </div>
              )}
            </div>
          )}
        </div>
      </main>
    </div>
  );
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

function LoginPage() {
  const [mode, setMode] = useState('login');
  const [form, setForm] = useState({ name: '', email: '', password: '' });
  const [err,  setErr]  = useState('');
  const [busy, setBusy] = useState(false);

  const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));

  const submit = async () => {
    setErr(''); setBusy(true);
    const url  = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
    const body = mode === 'login'
      ? { email: form.email, password: form.password }
      : { name: form.name, email: form.email, password: form.password };
    try {
      const r    = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await r.json();
      if (!r.ok) { setErr(data.error || 'Erreur inconnue.'); return; }
      localStorage.setItem('pollapp_web_token', data.token);
      location.href = '/';
    } catch {
      setErr('Erreur réseau, réessayez.');
    } finally {
      setBusy(false);
    }
  };

  const switchMode = () => { setMode(m => m === 'login' ? 'register' : 'login'); setErr(''); };

  return (
    <div className="min-h-screen flex items-center justify-center p-4"
      style={{background:'linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#2563eb 100%)'}}>
      <div className="bg-white rounded-2xl p-8 w-full max-w-sm shadow-2xl anim-in">
        <div className="text-center mb-6">
          <div className="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
            <span className="text-white font-black text-2xl">P</span>
          </div>
          <h1 className="text-2xl font-extrabold text-gray-900">
            {mode === 'login' ? 'Connexion' : 'Créer un compte'}
          </h1>
          <p className="text-gray-400 text-sm mt-1">Espace enseignant</p>
        </div>

        <div className="space-y-3">
          {mode === 'register' && (
            <input value={form.name} onChange={set('name')} placeholder="Nom complet" autoFocus
              className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-300 text-gray-900 text-sm"
              onKeyDown={e => e.key === 'Enter' && submit()}/>
          )}
          <input value={form.email} onChange={set('email')} placeholder="Email" type="email"
            autoFocus={mode === 'login'}
            className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-300 text-gray-900 text-sm"
            onKeyDown={e => e.key === 'Enter' && submit()}/>
          <input value={form.password} onChange={set('password')} placeholder="Mot de passe" type="password"
            className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-300 text-gray-900 text-sm"
            onKeyDown={e => e.key === 'Enter' && submit()}/>
        </div>

        {err && <p className="text-red-500 text-sm mt-3 bg-red-50 px-3 py-2 rounded-lg">{err}</p>}

        <button onClick={submit} disabled={busy}
          className="w-full mt-5 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-bold rounded-xl transition-colors text-sm">
          {busy ? 'Chargementâ€¦' : mode === 'login' ? 'Se connecter â†’' : 'Créer mon compte â†’'}
        </button>

        <p className="text-center text-sm text-gray-400 mt-4">
          {mode === 'login' ? 'Pas encore de compte ?' : 'Déjà un compte ?'}{' '}
          <button onClick={switchMode} className="text-indigo-600 font-semibold hover:underline">
            {mode === 'login' ? 'Créer un compte' : 'Se connecter'}
          </button>
        </p>

        <div className="mt-5 pt-4 border-t border-gray-100 text-center">
          <button onClick={() => go('/')}
            className="text-xs text-gray-400 hover:text-gray-600 transition-colors">
            â† Retour à l'accueil
          </button>
        </div>
      </div>
    </div>
  );
}

      <div className="flex flex-col items-center px-4 pt-8 pb-16">

            Engagez votre audience<br/><span className="text-yellow-300">en temps réel</span>
          </h1>
          <p className="text-indigo-200 text-lg max-w-lg mx-auto">Sondages, nuages de mots, quiz â€” en quelques secondes.</p>
        </div>
        {!panel && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5 w-full max-w-xl anim-in">
            <button onClick={()=>go('/login')} className="lift bg-white rounded-2xl p-7 text-left shadow-lg">

function App() {
  const route            = useRoute();
  const { user, loading } = useLTIUser();

  if (!FB_READY)  return <FirebaseSetupScreen/>;
  if (loading)    return (
    <div className="min-h-screen flex items-center justify-center bg-slate-50">
      <div className="text-center">
        <div className="w-12 h-12 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">P</div>
        <p className="text-gray-400 text-sm">Chargementâ€¦</p>
      </div>
    </div>
  );

  /* â”€â”€ MODE LTI (lancé depuis Moodle) â”€â”€ */
  if (user) {
    if (user.role === 'instructor') return <LTIPresenter user={user}/>;
    return <LTIParticipant user={user}/>;
  }

  /* â”€â”€ MODE STANDALONE â”€â”€ */
  if (route.page === 'login')   return <LoginPage/>;
  if (route.page === 'present') return <PresenterPage code={route.code}/>;
  if (route.page === 'join')    return <ParticipantPage initCode={route.code}/>;
  return <HomePage/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
